version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
backend:
  phases:
    build:
      commands:
        - echo 'Backend build phase'
  artifacts:
    baseDirectory: src
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
